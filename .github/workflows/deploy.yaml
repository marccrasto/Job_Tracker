name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The image tag to deploy (a commit SHA)"
        required: true

permissions:
  # Lets the job request an OIDC token from GitHub. Without this, AWS login fails
  id-token: write
  contents: read

concurrency:
  # Prevents two deploys from running at the same time and trample each other
  # Basically if there are two updates being applied, we run the first workflow through its entirety, deploy that version, then run the second workflow. This avoids two updates trying to be applied at the same time and fight with each other
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      # After this step, every aws command in later steps runs as the deploy role. The AWS CLI comes preinstalled on GitHub's Ubuntu runners.
      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Send Deploy Commands to EC2 Instance
        id: ssm
        env:
          VERSION: ${{ inputs.version }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        # --parameters reference the commands to send to the ec2 instance
          # set -e makes the script stop at the first failing command. Otherwise a failed pull would still be followed by deleting your working container.
          # || true stops the very first deploy from failing when there's no job-tracker container to remove yet.
          # /root/jobtracker.env is an absolute path. SSM runs commands as root, so the file you created is found there.
          # If the new container doesn't come up, curl -f exits non-zero, and the deploy shows as failed instead of silently leaving a broken app.
        # It is best to build JSON with jq which comes installed with the runner (Basically build an arg and then pass it into the commands)
        run: |
          PARAMS=$(jq -n --arg image "$DOCKERHUB_USERNAME/job-tracker:$VERSION" '{commands: [
            "set -e",
            "docker pull \($image)",
            "docker rm -f job-tracker || true",
            "docker run -d --name job-tracker --restart unless-stopped -p 3000:3000 --env-file /root/jobtracker.env \($image)",
            "sleep 5 && curl -fsS http://localhost:3000/health"
          ]}')

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters "$PARAMS" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      # A waiter is an AWS CLI command that keeps checking a status until it reaches an end state:
        # The command succeeds on the instance: the waiter exits with 0, and the step goes green.
        # The command fails: for example, the pull failed and set -e stopped the script. The waiter exits non-zero, and the step, and therefore the job, goes red.
      # That's what makes the workflow's result match what actually happened on the instance.
      - name: Wait for deploy to finish
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

      # get-command-invocation fetches the details of that run. --query picks one field out of the response, and --output text prints it as plain text instead of JSON:
        # Status: Success, Failed, and so on
        # StandardOutputContent: everything your commands printed, like the pull progress and the health check reply
        # StandardErrorContent: the error messages
      # if: ${{ always() && ... }}: normally, once a step fails, every later step is skipped. always() makes this one run anyway, so when the deploy fails, you can still see why in the workflow log. The second part, command_id != '', skips it only if the send step never produced an ID, because then there's nothing to look up.
      # One limit to know about: the waiter checks every 5 seconds, up to 20 times, so it gives up after about 100 seconds with "Max attempts exceeded", even if the deploy is still running. Your image is small, so pull and start usually finish well within that. If you ever hit it, the cause is a slow docker pull, not a broken deploy.
      - name: Show deploy output
        if: ${{ always() && steps.ssm.outputs.command_id != '' }}
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          echo "Status: $(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)"
          echo "----- output -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "----- errors -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text