version: '3'

tasks:
  setup:
    desc: Install dependencies and create .env
    cmds:
      - npm install
      - cp -n .env.example .env || true

  db:start:
    desc: Start the compose database and wait till it's healthy
    cmds:
      - docker compose up -d --wait database

  db:stop:
    desc: Stop the compose database (data is kept)
    cmds:
      - docker compose stop database

  db:init:
    desc: Create the database tables
    deps: [db:start]
    cmds:
      - npm run db:init

  dev:
    desc: Run the app with auto-restart
    deps: [db:start]
    cmds:
      - npm run dev

  test:
    desc: Run the test suite
    cmds:
      # npm test is shorthand for npm run test. Whenever 'run' is there, it is a keyword for running the script found in package.json
      - npm test

  lint:
    desc: Run ESLint
    cmds:
      - npm run lint

  check:
    desc: Lint and test, same as CI
    cmds:
      - task: lint
      - task: test

  install-ci:
    desc: Clean install from package-lock.json (used by CI)
    cmds:
      - npm ci

  up:
    desc: Run the whole stack (app + database) in Docker
    cmds:
      - docker compose up --build

  down:
    desc: Stop and remove the stack's containers (data is kept)
    cmds:
      - docker compose down